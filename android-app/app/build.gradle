plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.horizon.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.horizon.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
